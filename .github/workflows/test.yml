name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
        # 时区也进矩阵：学习日按**本地** 4:00 分界（规格 §7.3），
        # 测试里一旦写死某个时区偏移，换一个时区就整体错一天。
        # 0.2.8 第一次 CI 就是这么红的（test 20 / test 22 两条断言全挂），
        # 而本机 UTC+8 永远绿 —— 所以两个方向都得常跑。
        tz: ['UTC', 'Asia/Shanghai']
    env:
      TZ: ${{ matrix.tz }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 本仓库**零依赖**，故意不跑 npm install：
      # 装插件只需要 lib/client.js + cordis.patch.yml，不需要任何 node_modules。
      # 这一步同时就是在验证「陌生人拿到仓库后不需要装依赖」这条承诺。
      - name: 确认真的零依赖
        run: |
          if [ -d node_modules ]; then
            echo "::error::仓库里出现了 node_modules —— 本仓库应当是零依赖的"
            exit 1
          fi
          echo "✓ 没有 node_modules"

      # 产物必须是**可复现**的：重新构建后不能有任何 diff。
      # 这条能挡住「改了源码忘了重新构建」和「构建不确定」两类问题。
      - name: 重新构建产物
        run: python tools/build.py && python tools/build-plugin.py

      - name: 产物必须和提交的一致
        run: |
          if ! git diff --quiet -- lib/; then
            echo "::error::重新构建后 lib/ 有变化 —— 提交的产物不是最新的，或者构建不确定"
            git diff --stat -- lib/
            exit 1
          fi
          echo "✓ 产物可复现，与提交一致"

      - name: 十一个测试套件
        run: npm test

      - name: 构建期守卫：命名空间清单漏项
        run: node tools/verify-dangling-guard.mjs

      # 市场条目的校验规则是从上游 scripts/ 复刻的（同款解析器）。
      # 这里不装 js-yaml，所以用一条轻量断言代替：条目文件存在且三个必填字段在。
      - name: 市场条目自检
        run: |
          test -f README.md
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (!pkg.dsh || !pkg.dsh.bundle || !pkg.dsh.bundle.patch) {
              console.error('::error::package.json 没有声明 dsh.bundle.patch —— 市场会拒绝收录');
              process.exit(1);
            }
            if (!fs.existsSync(pkg.dsh.bundle.patch)) {
              console.error('::error::dsh.bundle.patch 指向的 ' + pkg.dsh.bundle.patch + ' 不存在');
              process.exit(1);
            }
            if (!pkg.dsh.client || pkg.dsh.client.platform !== 'web') {
              console.error('::error::dsh.client.platform 必须是 web');
              process.exit(1);
            }
            console.log('✓ dsh.bundle.patch 与 dsh.client.platform 都正常');
          "
